name: build-image

on:
  workflow_dispatch:

# packages: write dibutuhkan untuk push ke GitHub Container Registry (ghcr.io)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tentukan nama image
        env:
          REGISTRY: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          echo "IMAGE=$(echo "$REGISTRY" | tr -d '[:space:]')/kantin-api" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/kantin-api" >> "$GITHUB_ENV"

      - name: Login ke ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t "$IMAGE:v1" -t "$IMAGE:${{ github.sha }}" \
            -t "$GHCR_IMAGE:latest" -t "$GHCR_IMAGE:${{ github.sha }}" .

      - name: Push image
        run: |
          docker push --all-tags "$IMAGE"
          docker push --all-tags "$GHCR_IMAGE"
          echo "Image GHCR: $GHCR_IMAGE:${{ github.sha }}"
